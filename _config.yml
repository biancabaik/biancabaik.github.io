# Site Settings
title: "Bianca Baik"
name: "Bianca Baik"
description: "Personal academic website"
url: "https://biancabaik.github.io"
baseurl: ""

# Theme Configuration
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default" # Options: "air", "mint", "sunrise", "contrast"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Sidebar Profile Settings
author:
  name: "Bianca Baik"
  avatar: "/images/profile.jpg"
  bio: "PhD Student in Operations Management"
  employer: "University of Texas at Austin"
  employer_url: "https://www.utexas.edu"
  location: "Austin, TX"
  email: "bianca.baik@utexas.edu"
  github: "biancabaik"

# Default Page Settings
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
